<title>Homies · Your home. Your Terms. Always</title>
<style>html,body{margin:0;padding:0;min-width:0;background:#fff9f2}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{cursor:pointer}noscript{display:block;padding:24px;color:#233e38;font-size:18px}</style>
<style>
#homies-authority-preview{--ha-ink:#233e38;--ha-text:#3d554d;--ha-muted:#53665c;--ha-teal:#14695c;--ha-dark:#105548;--ha-paper:#fffefd;--ha-canvas:#fff9f2;--ha-line:#d7e2d7;--ha-sage:#e5f3e9;--ha-peach:#fde9dc;--ha-lilac:#eee8f8;--ha-butter:#fff1c7;--ha-sky:#e8f2f6;color-scheme:light;color:var(--ha-ink);background:radial-gradient(ellipse at 0 0,#edf8ec,transparent 42%),var(--ha-canvas);font:15px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:relative;isolation:isolate;display:grid;width:100%;min-width:0;border-radius:18px;-webkit-font-smoothing:antialiased}

#homies-authority-preview button:disabled{background:#e6e9e1;color:#53614e;border-color:#ccd3c5;cursor:not-allowed}

#homies-authority-preview .ha-modal-root:empty{display:none}
#homies-authority-preview .ha-shell{max-width:1340px;margin:auto;padding:14px 20px;display:grid;gap:10px;min-width:0}
#homies-authority-preview .ha-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-right:84px}
#homies-authority-preview .ha-brand{display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left;max-width:100%;min-width:0}
#homies-authority-preview .ha-brand-copy{min-width:0}
#homies-authority-preview .ha-home-mark{font-size:27px;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#e2efdf;flex:none}
#homies-authority-preview .ha-wordmark{font-size:27px;line-height:1.05;letter-spacing:-1px;font-weight:800}

#homies-authority-preview .ha-account{position:relative}
#homies-authority-preview .ha-account-toggle{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;min-width:80px;padding:8px 12px;border:1px solid #cddfcb;border-radius:14px;background:#eff6e9;font-weight:650}
#homies-authority-preview .ha-account-toggle[aria-expanded=true]{background:var(--ha-sage)}
#homies-authority-preview .ha-chevron{font-size:13px;color:var(--ha-muted)}
#homies-authority-preview .ha-account-popover{position:absolute;right:0;top:calc(100% + 7px);z-index:20;width:190px;border:1px solid var(--ha-line);border-radius:14px;padding:6px;background:var(--ha-paper);box-shadow:0 10px 28px #233e3820}
#homies-authority-preview .ha-account-popover p{font-size:13px;color:var(--ha-muted);padding:8px 10px}
#homies-authority-preview .ha-account-popover button{display:block;width:100%;min-height:44px;border:0;border-radius:8px;background:none;text-align:left;padding:9px 10px}

#homies-authority-preview .ha-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 88px;gap:9px}
#homies-authority-preview .ha-nav .ha-evals-nav{justify-content:center;text-align:center}
#homies-authority-preview .ha-eval-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#homies-authority-preview .ha-eval-row{display:grid;gap:7px;padding-top:11px;border-top:1px solid var(--ha-line)}

#homies-authority-preview .ha-eval-row p{font-size:14px;line-height:1.4}
#homies-authority-preview .ha-eval-source{padding-top:9px;border-top:1px solid var(--ha-line)}

#homies-authority-preview .ha-nav button{display:flex;align-items:center;gap:9px;min-height:53px;padding:8px 11px;border:1px solid var(--ha-line);border-radius:14px;background:var(--ha-paper);font-size:14px;font-weight:650;text-align:left}
#homies-authority-preview .ha-nav button[aria-current=step]{background:var(--ha-teal);border-color:var(--ha-teal);color:#fff}

#homies-authority-preview .ha-nav small{display:block;font-size:12px;letter-spacing:.7px;line-height:1.15;margin-bottom:2px}
#homies-authority-preview .ha-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
#homies-authority-preview .ha-kicker{font-size:12px;font-weight:750;letter-spacing:1px;color:var(--ha-teal);text-transform:uppercase;margin-bottom:4px}

#homies-authority-preview h2{font-size:19px;line-height:1.25;letter-spacing:-.25px;font-weight:700}
#homies-authority-preview h3{font-size:16px;line-height:1.3;font-weight:700}
#homies-authority-preview .ha-subtitle{font-size:14px;color:var(--ha-muted);margin-top:5px}
#homies-authority-preview .ha-deadline{flex:none;display:grid;gap:2px;border:1px solid #e6d9b1;border-radius:12px;padding:8px 11px;background:var(--ha-butter);font-size:13px;color:#684d25;text-align:left}
#homies-authority-preview .ha-deadline strong{font-size:14px;color:#5c4522}
#homies-authority-preview .ha-body{display:grid;gap:11px;min-width:0}

#homies-authority-preview .ha-panel{display:grid;gap:11px;min-width:0;padding:16px;border:1px solid var(--ha-line);border-radius:18px;background:var(--ha-paper);box-shadow:0 3px 14px #364c3805}

#homies-authority-preview .ha-panel.ha-sage{background:var(--ha-sage);border-color:#c7dfcc}
#homies-authority-preview .ha-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
#homies-authority-preview .ha-caption{font-size:13px;line-height:1.36;color:var(--ha-muted)}
#homies-authority-preview .ha-muted{color:var(--ha-muted)}
#homies-authority-preview .ha-label{font-size:14px;font-weight:650;color:var(--ha-muted)}
#homies-authority-preview .ha-money{font-size:35px;line-height:1.08;font-weight:760;letter-spacing:-.8px;font-variant-numeric:tabular-nums;display:block;margin:3px 0}
#homies-authority-preview .ha-money small{font-size:14px;letter-spacing:0;font-weight:450}
#homies-authority-preview .ha-money-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#homies-authority-preview .ha-money-box{padding:12px;border-radius:13px;background:var(--ha-sky)}
#homies-authority-preview .ha-money-box:last-child{background:var(--ha-peach)}
#homies-authority-preview .ha-money-box .ha-money{font-size:32px}
#homies-authority-preview .ha-insight{display:flex;gap:9px;align-items:start;border:1px solid #d2e2d4;border-radius:12px;padding:10px 12px;background:#edf6eb;color:#355443;font-size:14px;line-height:1.4}

#homies-authority-preview .ha-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

#homies-authority-preview .ha-money-input{display:flex;align-items:center;gap:6px;background:var(--ha-paper);border:1px solid #a5bdaa;border-radius:11px;padding:7px 11px;min-height:47px}
#homies-authority-preview .ha-money-input>span{font-size:21px;color:var(--ha-muted)}
#homies-authority-preview .ha-money-input input{width:100%;border:0;background:none;padding:0;font-size:24px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
#homies-authority-preview .ha-field small{font-size:13px;line-height:1.35;color:var(--ha-muted)}
#homies-authority-preview .ha-field input:disabled{color:var(--ha-ink);opacity:1}
#homies-authority-preview .ha-error{font-size:13px;color:#923f30;line-height:1.4}
#homies-authority-preview .ha-error:empty{display:none}

#homies-authority-preview .ha-row>span{color:var(--ha-muted)}
#homies-authority-preview .ha-row>strong{text-align:right;font-variant-numeric:tabular-nums}
#homies-authority-preview .ha-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;border:1px solid var(--ha-teal);border-radius:11px;background:var(--ha-teal);color:#fff;padding:9px 14px;font-size:15px;font-weight:700;line-height:1.3;text-align:center;max-width:100%;overflow-wrap:anywhere}
#homies-authority-preview .ha-btn:hover:not(:disabled){background:var(--ha-dark)}

#homies-authority-preview .ha-link{border:0;background:none;padding:4px 0;min-height:29px;color:var(--ha-teal);font-size:14px;font-weight:700;text-align:left;line-height:1.3;max-width:100%}

#homies-authority-preview .ha-badge{display:inline-flex;align-items:center;gap:5px;align-self:start;border:0;border-radius:7px;padding:4px 7px;background:#ecebe5;color:#4c5d50;font-size:13px;line-height:1.3;font-weight:550;white-space:normal}
#homies-authority-preview button.ha-badge{min-height:29px}

#homies-authority-preview .ha-flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
#homies-authority-preview .ha-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#homies-authority-preview .ha-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--ha-line);padding-top:10px}
#homies-authority-preview .ha-footer-left{display:flex;gap:14px;align-items:center;min-width:0}
#homies-authority-preview .ha-footer-left .ha-caption{max-width:480px}
#homies-authority-preview .ha-footer>.ha-btn{flex:none}
#homies-authority-preview .ha-discovery-note{font-size:14px;color:var(--ha-muted)}
#homies-authority-preview .ha-property-top{display:flex;align-items:center;gap:10px}

#homies-authority-preview .ha-preference{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ha-muted);flex-wrap:wrap}
#homies-authority-preview select{border:1px solid #a8c0ad;border-radius:9px;background:#f8fbf4;padding:7px 10px;font-size:14px;min-height:38px;max-width:100%}
#homies-authority-preview table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:1.35}
#homies-authority-preview th,#homies-authority-preview td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid #35514619;overflow-wrap:anywhere}
#homies-authority-preview th{font-weight:650}
#homies-authority-preview th:first-child{width:28%;color:var(--ha-muted);font-weight:500}
#homies-authority-preview td{font-variant-numeric:tabular-nums}
#homies-authority-preview td small{display:block;font-size:13px;color:var(--ha-muted);margin-top:3px}
#homies-authority-preview tr.ha-total{background:#eaf4e7}
#homies-authority-preview tr.ha-total :is(th,td){font-weight:750;color:var(--ha-ink)}
#homies-authority-preview .ha-checklist{display:grid;gap:9px}
#homies-authority-preview .ha-check-item{display:flex;gap:10px;align-items:start;border-bottom:1px solid #35514619;padding-bottom:9px}

#homies-authority-preview .ha-check-mark{display:grid;place-items:center;flex:none;width:25px;height:25px;background:#e7eee0;border-radius:8px;font-size:14px}
#homies-authority-preview .ha-check-item p{font-size:14px;color:var(--ha-muted);margin-top:3px}
#homies-authority-preview .ha-check{display:flex;align-items:start;gap:9px;font-size:15px;line-height:1.4}

#homies-authority-preview .ha-fact .ha-check span{display:grid;gap:3px}

#homies-authority-preview .ha-evidence-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid #35514619}

#homies-authority-preview .ha-tone select{width:143px}
#homies-authority-preview textarea{display:block;width:100%;height:278px;min-height:0;resize:none;border:1px solid #b7cdb6;border-radius:11px;background:#fffefa;padding:10px 12px;font-size:16px;line-height:1.38;color:var(--ha-ink);overflow-wrap:anywhere}
#homies-authority-preview .ha-edit-status{font-size:13px;font-weight:600;color:var(--ha-teal)}
#homies-authority-preview .ha-edit-status.is-edited{color:#644780}
#homies-authority-preview .ha-receipt{display:flex;gap:9px;align-items:start;padding:9px 11px;border:1px solid #ccdfcc;border-radius:11px;background:#eef7e9;font-size:14px}
#homies-authority-preview .ha-receipt>div{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
#homies-authority-preview .ha-receipt strong{display:block}
#homies-authority-preview .ha-movement{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid #35514619;font-size:14px}
#homies-authority-preview .ha-movement>span{color:var(--ha-muted)}
#homies-authority-preview .ha-movement strong{text-align:right;font-variant-numeric:tabular-nums;flex:none}
#homies-authority-preview .ha-movement:last-child{border:0}
#homies-authority-preview .ha-celebrate{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid #a8ccb2;border-radius:16px;background:linear-gradient(105deg,#e1f2e6,#f1f8e5)}
#homies-authority-preview .ha-celebrate-mark{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:50%;background:#c9e7cf;font-size:25px;color:var(--ha-dark);font-weight:750}

#homies-authority-preview .ha-choice-head{display:flex;gap:8px;align-items:start;font-size:16px;font-weight:750}

#homies-authority-preview .ha-stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}

#homies-authority-preview .ha-timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;list-style:none;padding:0;counter-reset:journey}

#homies-authority-preview .ha-time-title{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ha-muted)}

<body>
<div id="homies-authority-preview" data-standalone><div class="ha-mainui"></div><div class="ha-modal-root"></div><div class="ha-live ha-sr-only" aria-live="polite"></div></div>
<noscript>Please enable JavaScript to explore Mia’s interactive Homies journey.</noscript>
<script>
/* Homies' deterministic, local demo model. No request is sent to a real person. */
function createHomiesModel() {
  const freeze = value => {
    if (value && typeof value === 'object' && !Object.isFrozen(value)) {
      Object.values(value).forEach(freeze);
      Object.freeze(value);
    }
    return value;
  };
  const clone = value => JSON.parse(JSON.stringify(value));
  const cents = value => Math.round((value + Number.EPSILON) * 100) / 100;
  const money = value => new Intl.NumberFormat('en-US', {style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:2}).format(value);
  const pct = (change, benchmark) => (change / benchmark * 100).toFixed(1) + '%';
  const makeOffer = (base, amenity, stage) => freeze({base:cents(base),amenity:cents(amenity),total:cents(base+amenity),stage,simulated:true});
  const current = makeOffer(2100,45,'current');
  const original = makeOffer(2600,45,'original');
  const movingCost = 1200;
  const deadline = 'December 8, 2026';
  const properties = freeze([
    {id:'grove',name:'Grove Courtyard',base:2200,locality:'Grove Street',size:475,unit:'Studio',pathMinutes:4,availability:'January 7–15, 2027',simulated:true},
    {id:'newport',name:'Newport Terrace',base:2240,locality:'Newport',size:510,unit:'Studio',pathMinutes:3,availability:'January 10, 2027',simulated:true}
  ]);
  const tones = freeze({
    warm:{label:'Warm',description:'Cooperative and personable'},
    professional:{label:'Professional',description:'Balanced and precise'},
    firm:{label:'Firm',description:'Direct and courteous'}
  });
  const roundNames = ['initial','followup','further'];
  const normalizeRound = round => ({1:'initial',2:'followup',3:'further'})[round] || round;
  const normalizeOutcome = outcome => ({stay:'success',move:'hold'})[outcome] || outcome;
  const freshDraft = () => ({text:null,tone:'professional',revision:0,edited:false,needsReview:false,cache:{}});
  const initialState = () => ({
    plan:freeze({requestedBase:2200,ceiling:2265}),planSaved:false,planLocked:false,
    facts:{water:false,amenities:false},shortlist:[],preferredId:null,
    propertyReviews:{grove:{fit:false,conditions:false},newport:{fit:false,conditions:false}},
    drafts:{initial:freshDraft(),followup:freshDraft(),further:freshDraft()},
    sent:{initial:null,followup:null,further:null},pendingReviews:{initial:null,followup:null,further:null},
    firstOffer:null,finalOffer:null,outcome:'success',decision:null,completion:null,
    contextVersion:0,sequence:0
  });
  const state = initialState();
  const ok = value => ({ok:true,...value});
  const fail = error => ({ok:false,error});
  const property = id => properties.find(item => item.id===id) || null;
  const selectedProperties = () => state.shortlist.map(property).filter(Boolean);
  const preferredProperty = () => state.shortlist.includes(state.preferredId) ? property(state.preferredId) : null;
  const isBackupReviewed = (id=state.preferredId) => !!(state.shortlist.includes(id) && state.propertyReviews[id]?.fit && state.propertyReviews[id]?.conditions);
  const latestOffer = () => state.finalOffer || state.firstOffer || original;
  const nextCounterBase = () => cents(Math.floor(((original.base+state.plan.requestedBase)/2)*100 + 1e-7)/100);
  const evidenceText = tone => {
    const facts=[];
    if(state.facts.water)facts.push('the six-month hot-water disruption that was resolved in July');
    if(state.facts.amenities)facts.push('the continuing amenity gaps');
    if(!facts.length)return '';
    const value=facts.join(' and ');
    return {warm:`I hope you can take ${value} into account.`,professional:`My request also reflects ${value}.`,firm:`Please take ${value} into account when reviewing these terms.`}[tone];
  };
  function sampleDraft(round,tone='professional') {
    round=normalizeRound(round);
    if(!roundNames.includes(round))throw new Error('Unknown draft round.');
    if(!Object.hasOwn(tones,tone))tone='professional';
    const request=money(state.plan.requestedBase),originalBase=money(original.base),fee=money(original.amenity);
    const counter=money(state.firstOffer?.base ?? nextCounterBase());
    const salutation=tone==='warm'?'Hello Leasing Team,':'Dear Leasing Team,';
    const closing=tone==='warm'?'Best,\nMia':tone==='professional'?'Kind regards,\nMia':'Regards,\nMia';
    const ending={warm:`Could you let me know before my final response is due on ${deadline}?`,professional:`Please reply before my final-response deadline of ${deadline}.`,firm:`Please provide your decision before my final-response deadline of ${deadline}.`}[tone];
    if(round==='further') {
      const offer=latestOffer();
      const terms=`${money(offer.base)} base rent${offer.amenity?` plus the ${money(offer.amenity)} amenity fee`:', with the amenity fee waived'}`;
      const body={
        warm:`Thank you for your latest proposal of ${terms}. I appreciate your consideration. Could we explore a further reduction in base rent or a one-time concession?`,
        professional:`Thank you for your latest proposal of ${terms}. Before deciding, I would like to explore a further reduction in base rent or a one-time concession.`,
        firm:`Your latest proposal is ${terms}. I am requesting a further reduction in base rent or a one-time concession before making my decision.`
      }[tone];
      const end={warm:`Could you confirm the full fee schedule and any revised written terms before my final response is due on ${deadline}?`,professional:`Please confirm the full fee schedule and any revised written terms before my final-response deadline of ${deadline}.`,firm:`Please provide the full fee schedule and any revised written terms before my final-response deadline of ${deadline}.`}[tone];
      return [salutation,body,[evidenceText(tone),end].filter(Boolean).join(' '),closing].join('\n\n');
    }
    const first={
      warm:`Thank you for the renewal offer of ${originalBase} base rent plus the ${fee} amenity fee. I would be glad to renew for 12 months at ${request} base rent, with the amenity fee waived.`,
      professional:`After reviewing your offer of ${originalBase} base rent plus the ${fee} amenity fee, I propose a 12-month renewal at ${request} base rent, with the amenity fee waived.`,
      firm:`The renewal offer is ${originalBase} base rent plus the ${fee} amenity fee. I am requesting revised terms: ${request} base rent for 12 months, with the amenity fee waived.`
    }[tone];
    const followIntro={
      warm:`Thank you for lowering the base rent from ${originalBase} to ${counter}. I appreciate your flexibility; the ${fee} amenity fee remains.`,
      professional:`Thank you for the revised offer: base rent reduced from ${originalBase} to ${counter}, with the ${fee} amenity fee retained.`,
      firm:`I acknowledge the base-rent reduction from ${originalBase} to ${counter}. The ${fee} amenity fee remains.`
    }[tone];
    const followAsk={warm:`Could we revisit a 12-month renewal at ${request} base rent, with the amenity fee waived?`,professional:`I would like you to reconsider ${request} base rent for a 12-month renewal, with the amenity fee waived.`,firm:`My request remains ${request} base rent for 12 months, with the amenity fee waived.`}[tone];
    return [salutation,round==='initial'?first:followIntro,[round==='initial'?'':followAsk,evidenceText(tone),ending].filter(Boolean).join(' '),closing].join('\n\n');
  }
  function getDraft(round) {
    round=normalizeRound(round);
    if(!roundNames.includes(round))throw new Error('Unknown draft round.');
    const draft=state.drafts[round];
    if(draft.text===null) {draft.text=sampleDraft(round,draft.tone);draft.revision=1;}
    return draft;
  }
  function invalidateContext() {
    state.contextVersion++;
    for(const round of roundNames) {
      if(state.sent[round])continue;
      const draft=state.drafts[round];
      state.pendingReviews[round]=null;
      for(const tone of Object.keys(draft.cache)) {
        const cached=draft.cache[tone];
        if(cached.edited)cached.needsReview=true;
        else delete draft.cache[tone];
      }
      if(draft.text===null)continue;
      if(draft.edited)draft.needsReview=true;
      else {draft.text=sampleDraft(round,draft.tone);draft.needsReview=false;}
      draft.revision++;
    }
  }
  function setPlan(input) {
    if(state.planLocked)return fail('Your plan is attached to the first sent demo message. Start a new journey to change these amounts.');
    const requestedBase=Number(input?.requestedBase),ceiling=Number(input?.ceiling);
    if(!Number.isFinite(requestedBase)||!Number.isFinite(ceiling)||requestedBase<=0||ceiling<=0)return fail('Enter a positive requested base rent and a positive private ceiling.');
    if(!Number.isSafeInteger(Math.round(requestedBase*100))||!Number.isSafeInteger(Math.round(ceiling*100)))return fail('Enter valid monthly dollar amounts.');
    if(Math.abs(cents(requestedBase)-requestedBase)>1e-7||Math.abs(cents(ceiling)-ceiling)>1e-7)return fail('Use no more than two decimal places.');
    if(requestedBase>=original.base)return fail(`Set your requested base rent below the ${money(original.base)} renewal base.`);
    if(requestedBase>ceiling)return fail('Your private ceiling must cover your requested base rent.');
    const changed=state.plan.requestedBase!==requestedBase||state.plan.ceiling!==ceiling;
    state.plan=freeze({requestedBase:cents(requestedBase),ceiling:cents(ceiling)});state.planSaved=true;
    if(changed)invalidateContext();
    return ok({plan:state.plan,changed});
  }
  function toggleShortlist(id) {
    if(!property(id))return fail('Choose one of the listed homes.');
    if(state.shortlist.includes(id))state.shortlist=state.shortlist.filter(value=>value!==id);
    else state.shortlist=[...state.shortlist,id];
    if(!state.shortlist.includes(state.preferredId))state.preferredId=state.shortlist[0]||null;
    state.decision=null;state.completion=null;invalidateContext();
    return ok({shortlist:[...state.shortlist],preferredId:state.preferredId});
  }
  function setPreferred(id) {
    if(!state.shortlist.includes(id))return fail('Shortlist this home before choosing it as your preferred backup.');
    if(state.preferredId!==id){state.preferredId=id;state.decision=null;state.completion=null;invalidateContext();}
    return ok({property:preferredProperty()});
  }
  function setPropertyReview(id,key,value) {
    if(!state.shortlist.includes(id)||!['fit','conditions'].includes(key))return fail('Review a shortlisted home.');
    state.propertyReviews[id][key]=!!value;
    return ok({reviewed:isBackupReviewed(id)});
  }
  function setFact(key,value) {
    if(!Object.hasOwn(state.facts,key))return fail('Choose a listed fact.');
    if(state.facts[key]!==!!value){state.facts[key]=!!value;invalidateContext();}
    return ok({facts:{...state.facts}});
  }
  function setDraft(round,text) {
    round=normalizeRound(round);
    if(!roundNames.includes(round))return fail('Unknown draft round.');
    if(state.sent[round])return fail('This sent version is preserved in history.');
    if(typeof text!=='string')return fail('Enter your message as text.');
    const draft=getDraft(round);
    if(draft.text!==text){draft.text=text;draft.edited=true;draft.revision++;state.pendingReviews[round]=null;}
    return ok({draft});
  }
  function setTone(round,tone) {
    round=normalizeRound(round);
    if(!roundNames.includes(round)||!Object.hasOwn(tones,tone))return fail('Choose Warm, Professional, or Firm.');
    if(state.sent[round])return fail('The tone of a sent message is part of its history.');
    const draft=getDraft(round);
    if(draft.tone===tone)return ok({draft});
    draft.cache[draft.tone]={text:draft.text,edited:draft.edited,needsReview:draft.needsReview};
    const cached=draft.cache[tone];
    draft.tone=tone;draft.text=cached?.text??sampleDraft(round,tone);draft.edited=cached?.edited??false;draft.needsReview=cached?.needsReview??false;draft.revision++;
    state.pendingReviews[round]=null;
    return ok({draft});
  }
  function restoreSample(round) {
    round=normalizeRound(round);
    if(!roundNames.includes(round))return fail('Unknown draft round.');
    if(state.sent[round])return fail('This sent version is preserved in history.');
    const draft=getDraft(round);draft.text=sampleDraft(round,draft.tone);draft.edited=false;draft.needsReview=false;draft.revision++;delete draft.cache[draft.tone];state.pendingReviews[round]=null;
    return ok({draft});
  }
  function prepareReview(round) {
    round=normalizeRound(round);
    if(!roundNames.includes(round))return fail('Unknown draft round.');
    if(state.sent[round])return fail('This message has already been sent in the demo.');
    if(round==='followup'&&!state.sent.initial)return fail('Review and send the first request before preparing its follow-up.');
    if(round==='further'&&!state.sent.initial)return fail('Complete your first request before negotiating further.');
    const draft=getDraft(round);
    if(draft.text.trim().length<35)return fail('Add a complete message before reviewing it.');
    const review=freeze({id:`review-${++state.sequence}`,round,text:draft.text,tone:draft.tone,revision:draft.revision,edited:draft.edited,needsReview:draft.needsReview,recipient:'Fictional Leasing Team',requestedBase:state.plan.requestedBase,contextVersion:state.contextVersion,simulated:true});
    state.pendingReviews[round]=review;
    return ok({review});
  }
  function approveAndSendDemo(round,review,checked) {
    round=normalizeRound(round);
    if(!roundNames.includes(round))return fail('Unknown draft round.');
    if(!checked)return fail('Confirm that you reviewed this exact wording and recipient.');
    if(state.sent[round])return fail('This message has already been sent in the demo.');
    if(round==='followup'&&!state.sent.initial)return fail('The first sent request must come before its follow-up.');
    if(round==='further'&&!state.sent.initial)return fail('Send the first request before negotiating further.');
    const draft=getDraft(round);
    if(!review||review!==state.pendingReviews[round]||review.round!==round||review.text!==draft.text||review.tone!==draft.tone||review.revision!==draft.revision||review.contextVersion!==state.contextVersion)return fail('The message or its context changed. Review the current version before sending.');
    if(draft.text.trim().length<35)return fail('Add a complete message before reviewing it.');
    // The outgoing record deliberately contains no private-ceiling field.
    const sent=freeze({id:`message-${++state.sequence}`,round,text:review.text,tone:review.tone,revision:review.revision,edited:review.edited,recipient:review.recipient,requestedBase:review.requestedBase,simulated:true});
    state.sent[round]=sent;state.pendingReviews[round]=null;draft.needsReview=false;
    state.decision=null;state.completion=null;
    let offer=null;
    if(round==='initial'){
      state.planLocked=true;state.planSaved=true;
      state.firstOffer=makeOffer(nextCounterBase(),45,'first');offer=state.firstOffer;
      const followup=state.drafts.followup;
      if(followup.text===null&&!followup.edited)followup.tone=sent.tone;
      invalidateContext();
    } else if(round==='followup'){
      state.finalOffer=state.outcome==='success'?makeOffer(state.plan.requestedBase,0,'final'):makeOffer(state.firstOffer.base,state.firstOffer.amenity,'final');offer=state.finalOffer;
      const further=state.drafts.further;
      if(further.text===null&&!further.edited)further.tone=sent.tone;
      invalidateContext();
    }
    return ok({sent,offer});
  }
  function setOutcome(value) {
    const outcome=normalizeOutcome(value);
    if(!['success','hold'].includes(outcome))return fail('Choose a supported demo response.');
    if(state.finalOffer)return fail('Use the alternate-response preview to change a response already shown.');
    if(state.outcome!==outcome){state.outcome=outcome;state.decision=null;state.completion=null;invalidateContext();}
    return ok({outcome});
  }
  function previewOtherOutcome() {
    if(!state.sent.followup)return fail('Complete the approved follow-up before previewing the other response.');
    state.outcome=state.outcome==='success'?'hold':'success';
    state.finalOffer=state.outcome==='success'?makeOffer(state.plan.requestedBase,0,'final'):makeOffer(state.firstOffer.base,state.firstOffer.amenity,'final');
    state.decision=null;state.completion=null;
    // A further message belongs to its response branch. Restart it for the alternate preview.
    state.sent.further=null;state.pendingReviews.further=null;state.drafts.further=freshDraft();state.drafts.further.tone=state.sent.followup.tone;
    invalidateContext();
    return ok({outcome:state.outcome,offer:state.finalOffer});
  }
  function financials() {
    const offer=latestOffer(),previous=state.finalOffer?state.firstOffer:state.firstOffer?original:null;
    const originalReduction=cents(original.base-offer.base),currentIncrease=cents(offer.base-current.base),previousReduction=previous?cents(previous.base-offer.base):0;
    return {
      offer,previous,currentBase:current.base,originalBase:original.base,
      currentIncrease,currentIncreasePct:pct(currentIncrease,current.base),
      originalReduction,originalReductionPct:pct(originalReduction,original.base),
      previousReduction,previousReductionPct:previous?pct(previousReduction,previous.base):'0.0%',
      annualBaseSavings:cents(originalReduction*12),annualBaseIncrease:cents(currentIncrease*12),
      withinCeiling:offer.total<=state.plan.ceiling,headroom:cents(state.plan.ceiling-offer.total),
      requestedTermsMet:offer.base<=state.plan.requestedBase&&offer.amenity===0,
      targetReduction:cents(original.base-state.plan.requestedBase),targetReductionPct:pct(original.base-state.plan.requestedBase,original.base),targetAnnualSavings:cents((original.base-state.plan.requestedBase)*12)
    };
  }
  function comparison() {
    const offer=latestOffer();
    const stay={id:'renew',name:'Your home',base:offer.base,annualBase:cents(offer.base*12),moving:0,firstYear:cents(offer.base*12)};
    const options=selectedProperties().map(item=>({...item,annualBase:cents(item.base*12),moving:movingCost,firstYear:cents(item.base*12+movingCost),differenceVsStay:cents(item.base*12+movingCost-stay.firstYear),baseWithinCeiling:item.base<=state.plan.ceiling,reviewed:isBackupReviewed(item.id)}));
    const preferred=options.find(item=>item.id===state.preferredId)||null;
    return {stay,options,preferred,difference:preferred?preferred.differenceVsStay:null,movingCost,period:'January 16, 2027–January 15, 2028',basis:'Base rent for 12 months, plus estimated moving once'};
  }
  function recommendation() {
    const f=financials(),c=comparison(),backup=c.preferred,prepared=!!(backup&&backup.reviewed&&backup.baseWithinCeiling);

  const p=preferred();if(!p||!m.isBackupReviewed()){showModal('Get your backup ready to verify',`<p>${p?'Review '+p.name+' before pursuing the move.':'Shortlist a home before choosing to pursue a move.'} Keep your renewal response date in view.</p>`,btn(p?'Review my backup':'Choose a backup',p?'backup':'options'));return;}
  if(p.base>s.plan.ceiling){showModal('This backup exceeds your ceiling',`<p>${p.name} has a ${cash(p.base)} base rent, above your ${cash(s.plan.ceiling)} private ceiling. Reconsider the shortlist before choosing this move.</p>`,btn('Review my shortlist','options'));return;}
  showModal('Pursue '+p.name+' with a clear plan',`<div class="ha-checklist"><p><strong>1.</strong> Arrange a viewing and confirm the move date.</p><p><strong>2.</strong> Get the unit’s written terms and a moving quote.</p><p><strong>3.</strong> Review the application and lease before committing.</p></div><p class="ha-caption">Plan for the estimated ${cash(m.movingCost)} move once. Your renewal response is still due December 8. No home has been booked.</p>`,btn('Keep considering','close',true)+btn('Confirm my move direction','complete-move'));return;
 }
 if(ui.choice==='negotiate'){
  const f=m.financials();
  if(f.withinCeiling){showModal('You can choose another round. Here is the tradeoff.',`${insight(f.requestedTermsMet?'Your requested terms and ceiling are met.':'Your ceiling is met; your target still deserves a conscious choice.','I recommend confirming the written renewal if these terms work for you.')}<p>Another round can add delay while shortlisted homes may become unavailable. The alternatives are not reserved; further negotiation does not automatically remove them.</p><p class="ha-caption">You remain in control. A better offer is not guaranteed.</p>`,btn('Continue negotiating','further',true)+btn('Choose renewal','choose-renew'));return;}
  showFurther();
 }
}
function showEvals(){
 showModal('Evals',`<div class="ha-between"><p><strong>10 formal scenarios</strong>, personally reviewed by Fizza.</p><span class="ha-badge">Read-only</span></div><div class="ha-eval-summary" aria-label="Recorded backend evaluation verdicts"><div class="ha-stat"><span class="ha-label">Pass</span><strong>8</strong></div><div class="ha-stat"><span class="ha-label">Needs work</span><strong>1</strong></div><div class="ha-stat"><span class="ha-label">Fail</span><strong>1</strong></div></div><section class="ha-eval-row" aria-label="Failed scenario"><div class="ha-between"><h3>Fail</h3><code>adaptive-paired-3-v01</code></div><p>Recommended an ineligible property.</p></section><section class="ha-eval-row" aria-label="Scenario needing work"><div class="ha-between"><h3>Needs work</h3><code>adaptive-paired-4-v01</code></div><p>Opened with supplicant phrasing: “Would you consider…”</p><p><strong>What changed in this demo:</strong> The professional sample uses a direct proposal: “I propose a 12-month renewal…”</p></section>${insight('The connection to Mia’s journey','Mia can rewrite the follow-up, then approve the exact version used by the demo.',false,'✎')}<p class="ha-caption ha-eval-source"><strong>Source: Fizza’s tested backend.</strong> This page only displays her review; it does not run those evaluations. The original recorded verdicts are retained.</p>`,btn('Return to where I was','close',true));
}
function showDemo(){if(ui.page===0&&!savePlan())return;showModal('Demo controls',`<p>This is a local, simulated journey. No live search, real email, booking or lease acceptance takes place.</p><p class="ha-caption">Your edits are preserved exactly. The demo response uses your saved requested rent and the selected path.</p>${s.finalOffer?'<p>The final response is already shown. You can preview the alternate response while preserving the first two sent messages.</p>':`<label class="ha-preference">Simulated final response<select id="ha-outcome"><option value="success" ${s.outcome==='success'?'selected':''}>Requested terms met</option><option value="hold" ${s.outcome==='hold'?'selected':''}>Landlord holds the counteroffer</option></select></label>`}`,btn('Restart demo','restart',true)+btn(s.finalOffer?'Preview other response':'Apply response path',s.finalOffer?'other-outcome':'apply-outcome'));}
root.addEventListener('click',e=>{
 if(!e.target.closest('.ha-account'))closeAccount();
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.page!==undefined){go(Number(b.dataset.page));return;}
 const a=b.dataset.act;if(!a)return;
 if(a==='evals'){showEvals();return;}
 if(a==='account'){const p=main.querySelector('.ha-account-popover');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));return;}
 if(a==='close'){captureEditor();closeModal();return;}
 if(a==='home'){go(-1);return;}
 if(a==='resume'){go(s.completion?10:ui.resumePage);return;}
 if(a==='restart'){closeModal(false);m.restart();ui.choice=null;ui.review=null;ui.page=0;ui.resumePage=0;render();live.textContent='New demo started. Your plan and shortlist have been reset.';return;}
 if(a==='back'){go(Math.max(0,ui.page-1));return;}
 if(a==='save-plan'){if(savePlan())go(1);return;}
 if(a==='next'){if(ui.page===1&&!s.shortlist.length)return;if(ui.page===3&&!m.isBackupReviewed())return;go(ui.page+1);return;}
 if(a==='options'){go(1);return;}if(a==='compare'){go(2);return;}if(a==='backup'){go(3);return;}if(a==='evidence'){go(4);return;}if(a==='followup'){go(7);return;}if(a==='decision-page'){go(9);return;}
 if(a==='shortlist'){m.toggleShortlist(b.dataset.property);ui.choice=null;render();main.querySelector(`[data-act="shortlist"][data-property="${b.dataset.property}"]`)?.focus({preventScroll:true});return;}
 if(a==='property'){showSource(b.dataset.property);return;}if(a==='source'){showSource(b.dataset.source);return;}if(a==='standards'){showSource('standards');return;}
 if(a.startsWith('math-')){showMath(a.slice(5));return;}
 if(a==='deadline'){showModal('One clear renewal-response date',`<div>${row('Original offer received','November 8, 2026')}${row('Final renewal response due','December 8, 2026')}${row('Current lease ends','January 15, 2027')}${row('New 12-month term begins','January 16, 2027')}</div><p>December 8 is the requested final-response date in the fictional renewal offer. The back-and-forth window ends then; it is separate from lease expiry.</p>`);return;}
 if(a==='review'){showReview(getRound());return;}if(a==='review-further'){showReview('further');return;}
 if(a==='keep-editing'){const round=ui.review?.round;if(round==='further')showFurther();else{closeModal();main.querySelector('textarea')?.focus();}return;}
 if(a==='restore'){const round=b.dataset.round;m.restoreSample(round);if(round==='further'){showFurther();modal.querySelector('textarea').focus();}else{render();main.querySelector('textarea').focus();}return;}
 if(a==='send-approved'){
  const review=ui.review,result=m.approveAndSendDemo(review?.round,review,!!modal.querySelector('#ha-approve-confirm')?.checked);
  if(!result.ok){const error=modal.querySelector('#ha-review-error');if(error)error.textContent=result.error;return;}
  ui.choice=null;ui.review=null;if(result.sent.round==='further'){m.complete('negotiate');go(10);}else go(result.sent.round==='initial'?6:8);return;
 }
 if(a==='view-reply'){go(ui.page===5?6:8);return;}if(a==='history'){showHistory(b.dataset.round);return;}
 if(a==='other-outcome'){const r=m.previewOtherOutcome();if(r.ok){ui.choice=null;go(8);}return;}
 if(a==='decision'){decide();return;}if(a==='further'){showFurther();return;}
 if(a==='choose-renew'){ui.choice='renew';closeModal();render();decide();return;}
 if(a==='complete-renew'||a==='complete-move'){const result=m.complete(a==='complete-renew'?'renew':'move');if(result.ok)go(10);else showModal('Review this choice',`<p>${esc(result.error)}</p>`);return;}
 if(a==='demo'){showDemo();return;}
 if(a==='apply-outcome'){const value=modal.querySelector('#ha-outcome').value;const result=m.setOutcome(value);if(result.ok){ui.choice=null;closeModal();render();}return;}
});
root.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.preferred!==undefined){m.setPreferred(el.value);ui.choice=null;render();main.querySelector('[data-preferred]')?.focus({preventScroll:true});return;}
 if(el.dataset.check){m.setPropertyReview(s.preferredId,el.dataset.check,el.checked);render();main.querySelector(`[data-check="${el.dataset.check}"]`)?.focus({preventScroll:true});return;}
 if(el.dataset.fact){m.setFact(el.dataset.fact,el.checked);return;}
 if(el.dataset.tone){captureEditor();const round=el.dataset.tone;m.setTone(round,el.value);if(round==='further'){showFurther();modal.querySelector('[data-tone]')?.focus({preventScroll:true});}else{render();main.querySelector('[data-tone]')?.focus({preventScroll:true});}return;}
 if(el.name==='ha-decision'){ui.choice=el.value;render();main.querySelector(`[name="ha-decision"][value="${ui.choice}"]`)?.focus({preventScroll:true});}
});
root.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.draft&&!el.readOnly){m.setDraft(el.dataset.draft,el.value);const scope=ui.modalKind==='editor'?modal:main;const status=scope.querySelector('[data-edit-status]');if(status){status.textContent=draftStatus(el.dataset.draft);status.classList.add('is-edited');}fitEditor(el);}
 if(el.dataset.goal){const target=Number(main.querySelector('#ha-request')?.value),output=main.querySelector('#ha-plan-preview');if(output&&target>0&&target<m.original.base)output.textContent='At your target: '+cash(m.original.base-target)+'/month less base rent than the original offer.';const error=main.querySelector('#ha-plan-error');if(error)error.textContent='';}
});
root.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(modal.firstElementChild){captureEditor();closeModal();e.preventDefault();}else if(closeAccount(true))e.preventDefault();return;}
 if(e.key==='Tab'&&modal.firstElementChild){const focusable=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(el=>el.getClientRects().length),first=focusable[0],last=focusable.at(-1),active=root.ownerDocument.activeElement;if(e.shiftKey&&active===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&active===last){e.preventDefault();first.focus();}}
});
root.addEventListener('focusout',e=>{if(e.target.closest('.ha-account')&&!e.relatedTarget?.closest('.ha-account'))closeAccount();});
root.ownerDocument.addEventListener('click',e=>{if(!root.contains(e.target))closeAccount();});
const view=root.ownerDocument.defaultView;
view?.addEventListener('resize',fitEditors,{passive:true});
if(view?.ResizeObserver){let lastWidth=0;const observer=new view.ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(Math.abs(width-lastWidth)>.5){lastWidth=width;fitEditors();}});observer.observe(root);}
render();
})();

</script>
</body>
</html>
